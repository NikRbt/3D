<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>3D Engineering Studio</title>
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "three/addons/": "./node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="bar">
    <span class="brand">3D Engineering Studio</span>
    <select id="example" title="Beispielmodell laden"></select>
    <button id="btnOpen" title="Code aus Datei laden">Öffnen</button>
    <button id="btnSave" title="Code speichern (Strg+S)">Speichern</button>
    <button id="btnRun" class="primary" title="Strg+Enter">3D ausführen</button>
    <span class="spacer"></span>
    <button id="btnPrompt" title="Anweisung für die KI in die Zwischenablage kopieren">KI-Anweisung kopieren</button>
  </header>

  <main id="split">
    <section id="left">
      <div id="editor"></div>
      <div id="console">
        <div id="status" class="ok">Bereit</div>
        <pre id="log"></pre>
      </div>
    </section>

    <div id="gutter" title="Ziehen zum Anpassen"></div>

    <section id="right">
      <div id="viewport">
        <canvas id="canvas"></canvas>
        <div class="tools">
          <button id="tFit">Ansicht anpassen</button>
          <button id="tGrid" class="on">Raster</button>
          <button id="tAxes" class="on">Achsen</button>
          <button id="tWire">Drahtgitter</button>
          <button id="tPause">Animation pausieren</button>
        </div>
        <div class="hint">Linke Maustaste drehen · Rechte verschieben · Rad zoomen</div>
      </div>
    </section>
  </main>

  <script src="node_modules/monaco-editor/min/vs/loader.js"></script>
  <script type="module" src="renderer.js"></script>
</body>
</html>
